version: 2.1

jobs:
  CNT_29:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create @ now
          command: |
            mkdir -p /tmp/d1
            set +o pipefail 2>/dev/null; declare -A tbl; for i in $(seq 1 1000); do tbl[row_${i}]=$((i*17 % 251)); done; { echo "# table"; for k in "${!tbl[@]}"; do echo "${k}:${tbl[$k]}"; done ; } > /tmp/d1/blake_ccce49378939; true
            sha1sum /tmp/d1/blake_ccce49378939 | awk '{print "sha1-b:",substr($1,1,10)}'
      - persist_to_workspace:
          root: /tmp/d1
          paths:
            - 'blake_ccce49378939'
  full-send:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/d1
      - run:
          name: Check 5
          command: |
            date -r /tmp/d1/blake_ccce49378939 +%A 2>/dev/null || true
      - run:
          name: Fetch working tree
          command: git clone --depth 3 --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack sources
          command: tar --extract --gzip -f staging-store.tgz
      - run:
          name: Cooldown
          command: cmake --version
      - run:
          name: Settle filesystem
          command: cat /proc/cpuinfo | head -5
      - run:
          command: env ./sentinel-bin
